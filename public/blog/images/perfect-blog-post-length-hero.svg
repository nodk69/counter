<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#0b0f19;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative geometric grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Decorative modern accent circles -->
  <circle cx="1080" cy="120" r="180" fill="#06b6d4" opacity="0.06"/>
  <circle cx="1120" cy="520" r="240" fill="#0284c7" opacity="0.08"/>

  <!-- Main Card Container -->
  <rect x="70" y="70" width="1060" height="490" rx="24" fill="#131b2e" fill-opacity="0.8" stroke="#1f293d" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Top bar: Brand + Category Badge -->
  <g transform="translate(120, 130)">
    <!-- Brand -->
    <rect width="32" height="32" rx="8" fill="url(#accentGrad)"/>
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>
    <text x="44" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">counter<tspan fill="#06b6d4">.io</tspan></text>

    <!-- Badge -->
    <rect x="220" y="-4" width="220" height="40" rx="20" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.3"/>
    <text x="330" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#06b6d4" text-anchor="middle">Data Benchmark</text>
  </g>

  <!-- Article Title (Multi-line formatted) -->
  <g transform="translate(120, 240)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.8">
      <tspan x="0" y="0">The Perfect Blog Post Length: Data from 1</tspan><tspan x="0" y="50">Million Posts</tspan>
    </text>
  </g>

  <!-- Subtitle / Topics covered -->
  <g transform="translate(120, 420)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" fill="#94a3b8">
      Search Rankings · Social Shares · Organic Traffic Velocity
    </text>
  </g>

  <!-- Bottom Metric / Visual Graphic Pill -->
  
  <g transform="translate(120, 470)">
    <rect width="260" height="48" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="24" cy="24" r="6" fill="#06b6d4"/>
    <text x="40" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">SEO Sweet Spot:</text>
    <text x="160" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">2,200 Words</text>
  </g>
  

  <!-- Right Visual Icon Circle -->
  <g transform="translate(930, 240)">
    <circle cx="60" cy="60" r="70" fill="url(#accentGrad)" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="2"/>
    <g transform="translate(36, 36) scale(2)">
      <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>