<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#0b0f19;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative geometric grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Decorative modern accent circles -->
  <circle cx="1080" cy="120" r="180" fill="#d97706" opacity="0.06"/>
  <circle cx="1120" cy="520" r="240" fill="#b45309" opacity="0.08"/>

  <!-- Main Card Container -->
  <rect x="70" y="70" width="1060" height="490" rx="24" fill="#131b2e" fill-opacity="0.8" stroke="#1f293d" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Top bar: Brand + Category Badge -->
  <g transform="translate(120, 130)">
    <!-- Brand -->
    <rect width="32" height="32" rx="8" fill="url(#accentGrad)"/>
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>
    <text x="44" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">counter<tspan fill="#d97706">.io</tspan></text>

    <!-- Badge -->
    <rect x="220" y="-4" width="220" height="40" rx="20" fill="#d97706" fill-opacity="0.15" stroke="#d97706" stroke-opacity="0.3"/>
    <text x="330" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#d97706" text-anchor="middle">Style & Syntax</text>
  </g>

  <!-- Article Title (Multi-line formatted) -->
  <g transform="translate(120, 240)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.8">
      <tspan x="0" y="0">Passive Voice: When to Use It, When to</tspan><tspan x="0" y="50">Avoid It</tspan>
    </text>
  </g>

  <!-- Subtitle / Topics covered -->
  <g transform="translate(120, 420)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" fill="#94a3b8">
      Scientific Writing · Journalistic Clarity · Passive Traps
    </text>
  </g>

  <!-- Bottom Metric / Visual Graphic Pill -->
  
  <g transform="translate(120, 470)">
    <rect width="260" height="48" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="24" cy="24" r="6" fill="#d97706"/>
    <text x="40" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Clarity Impact:</text>
    <text x="160" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">High Directness</text>
  </g>
  

  <!-- Right Visual Icon Circle -->
  <g transform="translate(930, 240)">
    <circle cx="60" cy="60" r="70" fill="url(#accentGrad)" fill-opacity="0.12" stroke="#d97706" stroke-opacity="0.35" stroke-width="2"/>
    <g transform="translate(36, 36) scale(2)">
      <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke="#d97706" stroke-width="2.5"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke="#d97706" stroke-width="2.5"/>
    </g>
  </g>
</svg>